apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def enableMinifyInReleaseBuilds = (findProperty("android.enableMinifyInReleaseBuilds") ?: false).toBoolean()
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.maremovals.admin"
    compileSdk 36

    defaultConfig {
        applicationId "maremovals.uk"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (!keystoreProperties["storeFile"] || !keystoreProperties["storePassword"] || !keystoreProperties["keyAlias"] || !keystoreProperties["keyPassword"]) {
                throw new GradleException("Release signing is missing android/keystore.properties")
            }
            storeFile file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
}
